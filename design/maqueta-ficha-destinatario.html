<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview de templates</title>
<style>
:root {
  --mesa:#e8eaed; --linea:#d3d7dd; --papel:#fff; --papel-2:#f5f6f8;
  --tinta:#1f2430; --tinta-2:#4d5566; --tinta-3:#5d6573;
  --postal:#1f3a93; --barra-bg:#14275f; --postal-bg:#e8edf9; --postal-fondo:#f1f4fc; --postal-borde:#cdd6ee; --postal-quieto:#5a6b8c;
  --sello:#c62d1f; --sello-txt:#a8261a; --sello-bg:#fce9e6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-xxs:11px; --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-frase:15px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --dur-xs:120ms; --dur-md:180ms; --dur-lg:200ms;
  --barra-h:44px;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:var(--fs-md)/1.45 var(--font); color:var(--tinta); background:var(--mesa);
       display:flex; flex-direction:column; overflow:hidden; }
::selection { background:#c9d4f2; color:var(--tinta); }
:focus-visible { outline:2px solid var(--postal); outline-offset:2px; }
button { font:inherit; color:inherit; cursor:pointer; }
button[aria-disabled="true"] { cursor:not-allowed; }
.sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.ico { width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- barra fina ---------- */
.barra { flex:none; display:flex; align-items:center; gap:8px; min-height:var(--barra-h); padding:6px 14px;
         background:var(--papel); border-bottom:1px solid var(--linea); flex-wrap:wrap; }
.barra__t { margin:0 4px 0 0; font-size:var(--fs-md); font-weight:700; letter-spacing:-0.01em; }
.combo { display:flex; align-items:center; gap:8px; flex:0 1 340px; min-width:180px; height:30px; padding:0 10px;
         border:1px solid var(--linea); border-radius:6px; }
.combo:focus-within { border-color:var(--postal); box-shadow:0 0 0 1px var(--postal); }
.combo input { flex:1; min-width:0; border:0; outline:0; font:inherit; font-size:var(--fs-sm); color:var(--tinta); background:none; }
.combo__id { font-family:var(--mono); font-size:var(--fs-xxs); color:var(--tinta-3); }
.barra__esp { flex:1 1 0; }
.barra__grupo { display:inline-flex; gap:4px; }
.barra__sep { width:1px; height:20px; background:var(--linea); margin:0 4px; }
.btn { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px; font-size:var(--fs-sm); font-weight:600;
       border:1px solid var(--linea); border-radius:6px; background:var(--papel); white-space:nowrap; }
.btn:hover { background:var(--papel-2); }
.btn--post { background:var(--postal); border-color:var(--postal); color:#fff; }
.btn--post[aria-disabled="true"] { background:#5f6670; border-color:#5f6670; }
/* Barra en azul postal oscuro: la familia del azul de la ficha. */
.barra { background:var(--barra-bg); border-bottom-color:#0d1b45; color:#fff; }
.barra :focus-visible { outline-color:#fff; }
.barra .combo { background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.28); }
.barra .combo:focus-within { border-color:#fff; box-shadow:0 0 0 1px #fff; }
.barra .combo input { color:#fff; }
.barra .combo__id { color:rgba(255,255,255,.78); }
.barra .btn { background:transparent; border-color:rgba(255,255,255,.34); color:#fff; }
.barra .btn:hover { background:rgba(255,255,255,.12); }
.barra .btn--post { background:#fff; border-color:#fff; color:var(--barra-bg); }
.barra .btn--post[aria-disabled="true"] { background:rgba(255,255,255,.16); border-color:transparent; color:#fff; }
.barra .seg { border-color:rgba(255,255,255,.34); }
.barra .seg button { color:rgba(255,255,255,.88); }
.barra .seg button[aria-pressed="true"] { background:#fff; color:var(--barra-bg); }
.barra .zoom button { background:transparent; border-color:rgba(255,255,255,.34); color:#fff; }
.barra .zoom output { color:rgba(255,255,255,.88); }
.barra__sep { background:rgba(255,255,255,.3); }
.seg { display:inline-flex; padding:2px; border:1px solid var(--linea); border-radius:7px; }
.seg button { height:24px; padding:0 9px; border:0; border-radius:5px; background:none; font-size:var(--fs-xs); font-weight:600; color:var(--tinta-2); }
.seg button[aria-pressed="true"] { background:var(--tinta); color:#fff; }
.zoom { display:inline-flex; align-items:center; }
.zoom button { width:26px; height:26px; border:1px solid var(--linea); border-radius:6px; background:var(--papel); display:inline-flex; align-items:center; justify-content:center; }
.zoom button:disabled { opacity:.4; cursor:not-allowed; }
.zoom output { min-width:40px; text-align:center; font-family:var(--mono); font-size:var(--fs-xxs); color:var(--tinta-2); }

/* ---------- mesa: margen | correo | margen ---------- */
.mesa { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
        column-gap:28px; padding:20px 20px 40px; }
.margen { min-width:0; }
.margen__pega { position:sticky; top:0; }
.margen--izq .margen__pega { margin-left:auto; width:min(320px,100%); }
.margen--der .margen__pega { width:min(240px,100%); }
.centro { min-width:0; }
.hoja { position:relative; margin:0 auto; background:#fff; box-shadow:0 1px 2px rgba(31,36,48,.12), 0 12px 32px rgba(31,36,48,.14); }
.hoja iframe { position:absolute; top:0; left:0; border:0; transform-origin:0 0; display:block; }
.pie { margin:10px 0 0; font-size:var(--fs-xxs); color:var(--tinta-3); text-align:center; }

/* ---------- ficha del destinatario ---------- */
.ficha { background:var(--papel); border-radius:4px; padding:12px 16px 14px;
         box-shadow:0 1px 1px rgba(31,36,48,.08), 0 6px 18px rgba(31,36,48,.10); }
.ficha__cab { display:flex; align-items:baseline; gap:8px; }
.ficha__para { font-size:var(--fs-xxs); font-weight:700; letter-spacing:.12em; color:var(--postal); }
.ficha__n { margin-left:auto; font-family:var(--mono); font-size:var(--fs-xxs); color:var(--tinta-3); }
.vars { margin:10px 0 12px; }
.var { padding:10px 10px 12px; border:1px solid var(--postal-borde); border-radius:7px; background:var(--postal-fondo); }
.var + .var { margin-top:10px; }
.var__t { display:flex; align-items:center; gap:6px; margin:0 0 8px; font-size:var(--fs-xs); font-weight:700; letter-spacing:.06em; color:var(--postal); }
.var__n { font-family:var(--mono); font-size:var(--fs-xxs); font-weight:500; color:var(--tinta-3); }
.var--activa .var__t::after { content:""; flex:1; height:2px; margin-left:4px; border-radius:1px; background:var(--postal); opacity:.35; }
.var__g { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.var__g--uno { grid-template-columns:1fr; }
.var__g button { min-height:34px; padding:6px 8px; font-size:var(--fs-sm); line-height:1.2; color:var(--tinta);
  background:var(--papel); border:1px solid var(--postal-borde); border-radius:5px; }
.var__g button:hover { background:var(--postal-bg); }
.var__g button[aria-pressed="true"] { background:var(--postal); border-color:var(--postal); color:#fff; font-weight:600; }
.ficha__acc { display:flex; flex-wrap:wrap; gap:4px 14px; }
.lnk { border:0; background:none; padding:2px 0; font-size:var(--fs-xs); color:var(--tinta-2); text-decoration:underline;
       text-underline-offset:3px; text-decoration-color:var(--linea); }
.lnk:hover { color:var(--tinta); text-decoration-color:currentColor; }
.lnk[aria-expanded="true"] { color:var(--postal); }
.fechas { margin-top:10px; padding-top:10px; border-top:1px dashed var(--linea); }
.fecha + .fecha { margin-top:8px; }
.fecha label { display:block; font-size:var(--fs-xs); color:var(--tinta-2); margin-bottom:3px; }
.fecha input { width:100%; height:30px; padding:0 8px; font-family:var(--mono); font-size:var(--fs-xs); color:var(--tinta);
  border:1px solid var(--linea); border-radius:5px; }
.fecha input:focus-visible { outline:0; border-color:var(--postal); box-shadow:0 0 0 1px var(--postal); }
.fecha--editada input { border-color:var(--postal); color:var(--postal); }
.ficha__ayuda { margin:10px 0 0; font-size:var(--fs-xxs); color:var(--tinta-3); }
.ficha__ayuda kbd { font-family:var(--mono); font-size:var(--fs-xxs); padding:0 4px; border:1px solid var(--linea); border-radius:3px; background:var(--papel-2); }

/* ---------- matasellos ---------- */
.sello { display:block; padding:0; border:0; background:none; color:var(--sello); }
.sello svg { display:block; width:210px; height:118px; overflow:visible; transform:rotate(-7deg); }
.sello--quieto { color:var(--postal-quieto); }
.sello__aro { fill:none; stroke:currentColor; }
.sello__txt { fill:currentColor; font:700 8.5px var(--font); letter-spacing:.1em; }
.sello__num { fill:currentColor; font:800 38px var(--font); letter-spacing:-0.02em; }
.sello__ok { fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.sello__ond { fill:none; stroke:currentColor; stroke-width:2.2; opacity:.85; }
.sello:hover .sello__aro { stroke-width:3.5; }
/* La cifra cambia como evento visible: entra desde abajo y se asienta. */
.sello__num.cambia { animation:cifra var(--dur-md) var(--ease-out); }
@keyframes cifra { from { opacity:0; transform:translateY(8px); } }
.notas { list-style:none; margin:14px 0 0; padding:0; }
.notas li + li { margin-top:6px; }
.nota { display:flex; gap:8px; width:100%; padding:8px 10px; border:0; border-radius:4px; text-align:left;
        background:var(--sello-bg); color:#7a1a13; font-size:var(--fs-xs); line-height:1.35;
        box-shadow:0 1px 1px rgba(122,26,19,.10); }
.nota:hover { background:#f9d8d3; }
.nota .ico { margin-top:1px; width:12px; height:12px; stroke:var(--sello); stroke-width:3; }
.nota code { display:block; margin-top:2px; font-family:var(--mono); font-size:var(--fs-xxs); overflow-wrap:anywhere; }
.nota[disabled] { cursor:default; }

/* ---------- movimiento ---------- */
.btn, .seg button, .zoom button, .nota, .lnk, .var__g button { transition:background-color var(--dur-xs) ease, color var(--dur-xs) ease, transform var(--dur-xs) var(--ease-out); }
.btn:active:not([aria-disabled="true"]), .seg button:active, .zoom button:active:not(:disabled) { transform:scale(0.97); }
.nota:active:not([disabled]) { transform:scale(0.985); }
.var__g button:active { transform:scale(0.97); }
.sello:active svg { transform:rotate(-7deg) scale(0.97); }
.sello svg { transition:transform var(--dur-xs) var(--ease-out); }

/* Bajo ~1180 px los margenes no alcanzan: ficha y matasellos van en una linea sobre el correo. */
@media (max-width:1180px) {
  .mesa { grid-template-columns:minmax(0,1fr); row-gap:16px; justify-items:center; }
  .margen { width:100%; max-width:760px; }
  .margen__pega { position:static; }
  .margen--izq .margen__pega, .margen--der .margen__pega { width:100%; margin:0; }
  .margen--der .margen__pega { display:flex; gap:16px; align-items:flex-start; }
  .sello svg { width:150px; height:84px; }
  .notas { margin:0; flex:1; }
  .centro { max-width:100%; overflow-x:auto; order:2; }
  .margen--der { order:1; }
}
@media (max-width:900px) {
  .combo__id, .barra__sep { display:none; }
  .combo { flex:1 1 100%; order:9; }
  .margen--der .margen__pega { flex-direction:column; }
}
@media (prefers-reduced-motion:reduce) {
  .sello__num.cambia { animation:funde var(--dur-md) var(--ease-out); }
  @keyframes funde { from { opacity:0; } }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></symbol>
  <symbol id="i-mas" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-menos" viewBox="0 0 16 16"><path d="M3 8h10"/></symbol>
  <symbol id="i-enlace" viewBox="0 0 16 16"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.8 2.8 0 014 4l-1 1M9 11.5l-1 1a2.8 2.8 0 01-4-4l1-1"/></symbol>
  <symbol id="i-envia" viewBox="0 0 16 16"><path d="M5 11l6-6M6 5h5v5"/></symbol>
</svg>

<header class="barra" id="barra">
  <h1 class="barra__t">Preview</h1>
  <div class="combo">
    <label class="sr" for="buscar">Template</label>
    <input id="buscar" type="text" value="BCP - Incremento de l&iacute;nea TC (maqueta)" autocomplete="off" spellcheck="false"
           title="Buscar template o id (tecla /)" aria-keyshortcuts="/">
    <span class="combo__id" id="comboId">11104969</span>
  </div>
  <span class="barra__esp"></span>
  <div class="seg" role="group" aria-label="Dispositivo">
    <button type="button" id="bDesk" aria-pressed="true" title="Escritorio (tecla D)" aria-keyshortcuts="D">Escritorio</button>
    <button type="button" id="bMov" aria-pressed="false" title="M&oacute;vil (tecla M)" aria-keyshortcuts="M">M&oacute;vil</button>
  </div>
  <div class="zoom" role="group" aria-label="Zoom">
    <button type="button" id="zMenos" aria-label="Alejar"><svg class="ico"><use href="#i-menos"/></svg></button>
    <output id="zVal">100%</output>
    <button type="button" id="zMas" aria-label="Acercar"><svg class="ico"><use href="#i-mas"/></svg></button>
  </div>
  <span class="barra__sep" aria-hidden="true"></span>
  <div class="barra__grupo" role="group" aria-label="Descargar">
    <button type="button" class="btn" id="bHtml" title="Descargar el HTML tal como se ve">.html</button>
    <button type="button" class="btn" id="bPng" title="Descargar PNG: escritorio 700 px y m&oacute;vil 375 px">PNG</button>
    <button type="button" class="btn" id="bPdf" title="Descargar PDF: escritorio y m&oacute;vil">PDF</button>
  </div>
  <button type="button" class="btn" id="bEnlace"><svg class="ico"><use href="#i-enlace"/></svg>Copiar enlace</button>
  <button type="button" class="btn btn--post" id="bWf" aria-disabled="true" title="El env&iacute;o a Workfront est&aacute; pausado">Workfront<svg class="ico"><use href="#i-envia"/></svg></button>
</header>

<div class="mesa" id="mesa">
  <aside class="margen margen--izq" aria-label="Escenario">
    <div class="margen__pega">
      <div class="ficha" id="ficha">
        <div class="ficha__cab"><span class="ficha__para">PARA</span><span class="ficha__n" id="fichaN"></span></div>
        <div class="vars" id="frase"></div>
        <div class="ficha__acc">
          <button type="button" class="lnk" id="bDef">Por defecto</button>
          <button type="button" class="lnk" id="bMuestra">Ver campos</button>
          <button type="button" class="lnk" id="bFechas" aria-expanded="false" aria-controls="fechas">Fechas de muestra</button>
        </div>
        <div class="fechas" id="fechas" hidden></div>
        <p class="ficha__ayuda" id="ayuda"></p>
      </div>
    </div>
  </aside>
  <main class="centro">
    <div class="hoja" id="hoja"><iframe id="vista" sandbox="allow-same-origin" referrerpolicy="no-referrer" title="Vista del correo"></iframe></div>
    <p class="pie" id="pie">Datos de muestra ficticios</p>
  </main>
  <aside class="margen margen--der" aria-label="Pendientes">
    <div class="margen__pega">
      <button type="button" class="sello" id="sello" aria-expanded="true" aria-controls="notas">
        <svg viewBox="0 0 210 118" aria-hidden="true">
          <circle class="sello__aro" cx="59" cy="59" r="54" stroke-width="3"/>
          <circle class="sello__aro" cx="59" cy="59" r="44" stroke-width="1.4"/>
          <path id="arcoS" d="M 12.5 59 A 46.5 46.5 0 0 1 105.5 59" fill="none"/>
          <path id="arcoI" d="M 7.5 59 A 51.5 51.5 0 0 0 110.5 59" fill="none"/>
          <text class="sello__txt"><textPath href="#arcoS" startOffset="50%" text-anchor="middle" id="selloSup">PENDIENTES</textPath></text>
          <text class="sello__txt"><textPath href="#arcoI" startOffset="50%" text-anchor="middle" id="selloInf">REVISAR</textPath></text>
          <text class="sello__num" id="selloNum" x="59" y="72" text-anchor="middle">0</text>
          <path class="sello__ok" id="selloOk" d="M44 60l10 10 20-22" style="display:none"/>
          <path class="sello__ond" d="M118 38c10-7 20 7 30 0s20 7 30 0 20 7 28 0"/>
          <path class="sello__ond" d="M118 52c10-7 20 7 30 0s20 7 30 0 20 7 28 0"/>
          <path class="sello__ond" d="M118 66c10-7 20 7 30 0s20 7 30 0 20 7 28 0"/>
          <path class="sello__ond" d="M118 80c10-7 20 7 30 0s20 7 30 0 20 7 28 0"/>
        </svg>
        <span class="sr" id="selloSr"></span>
      </button>
      <ol class="notas" id="notas"></ol>
    </div>
  </aside>
</div>
<span class="sr" id="anuncio" role="status"></span>

<script type="text/plain" id="fuente"><!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>

<p><%@ include view='bcpSaludoEnaltaPrivVIEW6' %>,</p>
<%/* [acr-dc-start-group(g1)] */%><% if (targetData.CODPRODUCTO == 'TCRPLL') { %><%/* [acr-dc-start-cond(LATAM Platinum,1,a)] */%>

<%/* [acr-dc-end-cond] */%><% } else { %><%/* [acr-dc-start-cond(Resto de productos,4,a)] */%>

</td></tr>
<tr><td style="padding:0 32px">
<%/* [acr-dc-start-group(g2)] */%><% if (targetData.CODSUBSEGMENTO == 'M1N') { %><%/* [acr-dc-start-cond(Consumo,1,a)] */%>

<%/* [acr-dc-end-cond] */%><% } else if (targetData.CODSUBSEGMENTO == 'X1N') { %><%/* [acr-dc-start-cond(BEX,2,a)] */%>
<div class="bx"><b>Banca Exclusiva:</b> tu funcionario <%= targetData.NBRFUNCIONARIO %> te acompa&ntilde;a en el proceso.</div>
<%/* [acr-dc-end-cond] */%><% } %><%/* [acr-dc-end-group] */%>

<%/* [acr-dc-end-cond] */%><% } %><%/* [acr-dc-end-group] */%>
<p style="text-align:center;margin:26px 0"><a class="cta" href="https://example.com/oferta?c=<%= targetData.CODCAMPANA %>">Acepta tu nueva l&iacute;nea</a></p>
<p>V&aacute;lido del <%= targetData.FECINICIOVIGENCIACAMPANIA %> al <%= targetData.FECFINVIGENCIACAMPANIA %>.</p>
</td></tr>

</body></html></script>

<script>
(function () {
  var perfil = {}, VAL_OTRO = "otro";
  // BEGIN-PODA
  // Traza que manda el servidor: nombre del fragmento -> como quedo. Se llena
  // una vez al cargar la pagina (cargarFrgVia) y no cambia al podar.
  var FRG_VIA = {};
  function frgMotivo(n) {
    var v = FRG_VIA[n];
    if (v === "peso") return "se cort\u00f3 por tama\u00f1o";
    if (v === "ciclo") return "ciclo o profundidad";
    if (v === "sinhtml") return "existe pero no trae html";
    if (v === "errorconsulta") return "fall\u00f3 la consulta de fragmentos; revisar log del servidor";
    if (v === "errorcarga") return "fall\u00f3 la carga por id; revisar log del servidor";
    if (v === "mapavacio") return "la consulta no devolvi\u00f3 fragmentos";
    if (v === "mapalimite") return "no encontrado en las primeras 1000 filas; consulta incompleta";
    if (v === "noexiste") return "no encontrado en el mapa de fragmentos";
    return "sin diagn\u00f3stico del servidor";
  }
  // Los delimitadores se arman por partes para que el servidor no los tome por codigo.
  var O = "<" + "%", C = "%" + ">";
  function rx(s, f) { return new RegExp(s, f || "g"); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // Quita tildes y pasa a minusculas, para buscar sin acentos.
  function norm(s) {
    s = String(s).toLowerCase();
    var de = "\u00e1\u00e0\u00e4\u00e2\u00e9\u00e8\u00eb\u00ea\u00ed\u00ec\u00ef\u00ee\u00f3\u00f2\u00f6\u00f4\u00fa\u00f9\u00fc\u00fb\u00f1\u00e7";
    var a  = "aaaaeeeeiiiioooouuuunc";
    var o = "", i, j;
    for (i = 0; i < s.length; i++) { j = de.indexOf(s.charAt(i)); o += j < 0 ? s.charAt(i) : a.charAt(j); }
    return o;
  }

  // Mini evaluador SEGURO: solo targetData.X / recipient.X, textos, ==, !=, ===, !==, &&, ||, !, ( )
  // No usa eval ni Function: el contenido guardado no puede ejecutar codigo aqui.
  function tokenizar(s) {
    s = String(s).replace(/^\s+|\s+$/g, "");
    var re = /\s*(?:('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)|(\d+(?:\.\d+)?)|(===|!==|==|!=|&&|\|\||!|\(|\)))\s*/g;
    var out = [], pos = 0, m;
    while (pos < s.length) {
      re.lastIndex = pos;
      m = re.exec(s);
      if (!m || m.index !== pos) throw new Error("token");
      if (m[1] !== undefined) out.push({ t: "str", v: m[1].slice(1, -1).replace(/\\(.)/g, "$1") });
      else if (m[2] !== undefined) out.push({ t: "id", v: m[2] });
      else if (m[3] !== undefined) out.push({ t: "num", v: m[3] });
      else out.push({ t: "op", v: m[4] });
      pos = re.lastIndex;
    }
    return out;
  }

  // Solo estas tres variables se omiten al elegir variantes del preview.
  // Sus valores de muestra se siguen sustituyendo en el HTML por separado.
  function esContactoMuestra(nombre) {
    return nombre === "DESCORREOEENNPRINCIPAL" || nombre === "DESNBREENNPRINCIPAL" ||
      nombre === "DESCELULAREENNPRINCIPAL";
  }

  function evaluar(cond, perfil) {
    var tk = tokenizar(cond), i = 0;
    var OMITIDO = {};
    // Quitar un predicado no equivale a true: en un OR activaria Consumo.
    // Se conserva el otro operando en AND/OR y se propaga la omision en NOT/comparaciones.
    function combinar(a, b, esAnd) {
      if (a === OMITIDO) return b;
      if (b === OMITIDO) return a;
      return esAnd ? a && b : a || b;
    }
    function esOp(v) { var t = tk[i]; return !!t && t.t === "op" && t.v === v; }
    function pOr() { var a = pAnd(); while (esOp("||")) { i++; var b = pAnd(); a = combinar(a, b, false); } return a; }
    function pAnd() { var a = pNot(); while (esOp("&&")) { i++; var b = pNot(); a = combinar(a, b, true); } return a; }
    function pNot() {
      if (esOp("!")) { i++; var a = pNot(); return a === OMITIDO ? OMITIDO : !a; }
      return pCmp();
    }
    function pCmp() {
      var a = pPrim(), t = tk[i];
      if (t && t.t === "op" && (t.v === "==" || t.v === "===" || t.v === "!=" || t.v === "!==")) {
        i++;
        var b = pPrim();
        if (a === OMITIDO || b === OMITIDO) return OMITIDO;
        var eq = String(a) === String(b);
        return (t.v === "==" || t.v === "===") ? eq : !eq;
      }
      return a;
    }
    function pPrim() {
      var t = tk[i++];
      if (!t) throw new Error("fin");
      if (t.t === "op" && t.v === "(") {
        var v = pOr();
        if (!esOp(")")) throw new Error("paren");
        i++;
        return v;
      }
      if (t.t === "str" || t.t === "num") return t.v;
      if (t.t === "id") {
        var m = /^(?:targetData|recipient)\.(\w+)$/.exec(t.v);
        if (m) {
          if (esContactoMuestra(m[1])) return OMITIDO;
          return perfil[m[1]] === undefined ? "" : perfil[m[1]];
        }
        if (t.v === "true") return true;
        if (t.v === "false") return false;
        if (t.v === "null") return "";
      }
      throw new Error("no soportado");
    }
    var r = pOr();
    if (i !== tk.length) throw new Error("sobra");
    // Si solo habia condiciones de contacto, mostrar la primera variante.
    return r === OMITIDO || !!r;
  }

  function reGrupo() {
    return rx(O + "\\/\\*\\s*\\[acr-dc-start-group\\([^)]*\\)\\]\\s*\\*\\/" + C +
      "((?:(?!" + O + "\\/\\*\\s*\\[acr-dc-start-group)[\\s\\S])*?)" +
      O + "\\/\\*\\s*\\[acr-dc-end-group\\]\\s*\\*\\/" + C);
  }
  function reRama() {
    return rx(O + "\\s*\\}?\\s*(?:else\\s+)?(?:if\\s*\\(([\\s\\S]*?)\\)\\s*)?\\{\\s*" + C +
      "\\s*" + O + "\\/\\*\\s*\\[acr-dc-start-cond\\(([\\s\\S]*?)\\)\\]\\s*\\*\\/" + C +
      "([\\s\\S]*?)" + O + "\\/\\*\\s*\\[acr-dc-end-cond\\]\\s*\\*\\/" + C);
  }

  // Fechas de muestra relativas a hoy (dd/mm/aaaa): una fecha fija acaba vencida y parece un error del correo.
  function fechaMuestra(dias) {
    var d = new Date();
    d.setDate(d.getDate() + dias);
    var dd = d.getDate(), mm = d.getMonth() + 1;
    return (dd < 10 ? "0" : "") + dd + "/" + (mm < 10 ? "0" : "") + mm + "/" + d.getFullYear();
  }
  // Misma fecha en aaaammdd: la usan los utm_campaign de los enlaces (targetData.YYYYMMDD).
  function fechaCompacta(dias) {
    var f = fechaMuestra(dias);
    return f.slice(6) + f.slice(3, 5) + f.slice(0, 2);
  }
  // Valores de muestra: los tokens de personalizacion se reemplazan por estos valores.
  // Lo que no este aqui se ve como [CAMPO]. Son datos FICTICIOS.
  var diccionario = {
    "firstName": "Ana",
    "bcpSaludoEnaltaPrivVIEW6": "Estimada Ana",
    "bcpSoloPrimerNombre": "Ana",
    "DESNBREENNPRINCIPAL": "MARIA LOPEZ DEMO",
    "NBRFUNCIONARIO": "PEDRO GOMEZ DEMO",
    "DESCORREOEENNPRINCIPAL": "ejecutivo@example.com",
    "DESCORREOFUNCIONARIO": "ejecutivo@example.com",
    "DESCELULAREENNPRINCIPAL": "987654321",
    "NUMTELEFONOFUNCIONARIO": "987654321",
    "TCEA": "45.8",
    "FECINICIOVIGENCIACAMPANIA": fechaMuestra(0),
    "FECFINVIGENCIACAMPANIA": fechaMuestra(30),
    "FECFINVIGENCIACAMPANIAL": fechaMuestra(30),
    "MTOOFERTASOL": "3,000",
    "YYYYMMDD": fechaCompacta(0)
  };

  // Diccionario traduccion UI
  var DICCIONARIO_UI = {
      "CODSUBSEGMENTO": "SEGMENTO",
      "CODPRODUCTO": "PRODUCTO",
      "M1N": "CONSUMO",
      "X1N": "BEX",
      "TCRCLL": "LATAM Clasica",
      "TCRORL": "LATAM Oro",
      "TCRPLL": "LATAM Platinum",
      "TCRPL1": "LATAM Signature",
      "TCRBA7": "LATAM Sapphire",
      "AMXCLL": "Amex Clasica",
      "AMXGLL": "Amex Oro",
      "AMXPLL": "Amex Platinum",
      "AMXGRE": "Amex Black",
      "TCRLY5": "Qore Clasica",
      "TCRLY4": "Qore Platinum",
      "TCRLY3": "Qore Oro",
      "TCRLY2": "Qore Signature",
      "TCRLY1": "Qore Infinite"
  };

  // Funcion auxiliar para obtener la etiqueta visible
  function traducirUI(clave) {
      return DICCIONARIO_UI[clave] || clave;
  }
  // Fechas de muestra: el operador puede cambiarlas desde "Editar fechas" (van en la URL como d.CAMPO).
  var ETIQ_FECHA = {
    "FECINICIOVIGENCIACAMPANIA": "Inicio de vigencia de la campa\u00f1a",
    "FECFINVIGENCIACAMPANIA": "Fin de vigencia de la campa\u00f1a",
    "FECFINVIGENCIACAMPANIAL": "Fin de vigencia de la campa\u00f1a (variante L)"
  };
  var editados = {};
  function esFecha(k) { return /^FEC|FECHA/i.test(k); }
  function hayEditados() { for (var k in editados) if (editados.hasOwnProperty(k)) return true; return false; }
  // Marcas de texto para ubicar cada fecha en la vista; nunca llegan a ultimo.html.
  var MK_A = "\u27E6", MK_B = "\u27E7", MK_FIN = "\u27E6/\u27E7";
  var MF_A = "\u27EA", MF_B = "\u27EB";
  // Valores que dependen del escenario: PLASTICO es la tarjeta del PRODUCTO elegido en el panel.
  function valorDinamico(k) {
    if (k === "PLASTICO") {
      var c = perfil.CODPRODUCTO;
      if (c && c !== VAL_OTRO) return traducirUI(c);
    }
    return undefined;
  }
  function valorMuestra(k) {
    var din = valorDinamico(k);
    var v = editados.hasOwnProperty(k) ? editados[k] : (din !== undefined ? din : diccionario[k]);
    return (v !== undefined && v !== null && v !== "") ? esc(v) : null;
  }

  // opciones: { todas:bool, muestra:bool, marcar:bool, senalar:bool }
  // senalar (solo la vista): envuelve cada campo sin valor en MF_A..MF_B y deja un comentario
  // pv-sin-rama donde un grupo no tuvo rama; senalarFaltas los convierte en marcas ambar.
  // devuelve { html, elegidas:[{grupo,label}], noEval, noEvalTextos:[], includes:[], sinValor:[], fechas:[] }
  function podar(src, perfil, opciones) {
    opciones = opciones || {};
    var todas = !!opciones.todas;
    var conMuestra = opciones.muestra !== false;
    var elegidas = [], noEval = 0, noEvalTextos = [], includes = [], sinValor = [], fechas = [];
    var nGrupo = 0, guard = 0, out = src, prev;
    function anota(lista, v) { if (lista.indexOf(v) < 0) lista.push(v); }
    function token(key, x) {
      if (!key || !esFecha(key)) return x;
      anota(fechas, key);
      return opciones.marcar ? MK_A + key + MK_B + x + MK_FIN : x;
    }
    // En modo [CAMPOS] todos van sin valor a proposito: solo se senalan con datos de muestra.
    function falta(x) { return (opciones.senalar && conMuestra) ? MF_A + x + MF_B : x; }
    do {
      prev = out;
      out = out.replace(reGrupo(), function (m, body) {
        var ramas = [], r = reRama(), mm;
        while ((mm = r.exec(body))) {
          var partes = mm[2].split(",");
          ramas.push({
            cond: mm[1],
            label: partes.slice(0, Math.max(1, partes.length - 2)).join(","),
            html: mm[3]
          });
        }
        if (!ramas.length) return m;
        nGrupo++;
        var k, pick = -1;
        if (todas) {
          var acc = "";
          for (k = 0; k < ramas.length; k++) {
            acc += "<div style='font:11px Arial,sans-serif;background:#eef2ff;color:#4338ca;padding:2px 8px;'>RAMA: " +
                   esc(ramas[k].label) + "</div>" + ramas[k].html;
          }
          elegidas.push({ grupo: nGrupo, label: "todas", todas: true });
          return acc;
        }
        for (k = 0; k < ramas.length; k++) {
          if (ramas[k].cond === undefined) { pick = k; break; }
          try {
            if (evaluar(ramas[k].cond, perfil)) { pick = k; break; }
          } catch (e) { noEval++; anota(noEvalTextos, String(ramas[k].cond).replace(/\s+/g, " ")); }
        }
        if (pick < 0) {
          elegidas.push({ grupo: nGrupo, label: "", sin: true });
          return opciones.senalar ? "<!--pv-sin-rama " + nGrupo + "-->" : "";
        }
        elegidas.push({ grupo: nGrupo, label: ramas[pick].label });
        return ramas[pick].html;
      });
    } while (out !== prev && ++guard < 20);

    // Limpieza del codigo de Campaign que queda
    out = out.replace(rx(O + "\\/\\*[\\s\\S]*?\\*\\/" + C), "");
    out = out.replace(rx(O + "@\\s*include\\s+view\\s*=\\s*['\"]([^'\"]+)['\"]\\s*" + C),
      function (m, n) {
        if (valorMuestra(n) === null) anota(sinValor, n);
        var x = conMuestra ? valorMuestra(n) : null;
        return token(n, x !== null ? x : falta("[" + esc(n) + "]"));
      });
    out = out.replace(rx(O + "@\\s*include\\s+fragment\\s*=\\s*['\"]([^'\"]+)['\"]\\s*" + C),
      function (m, n) {
        var motivo = frgMotivo(n);
        anota(includes, n + " - " + motivo);
        return "<div style='font:11px Arial,sans-serif;background:#fef3c7;color:#92400e;padding:6px 8px;text-align:center;'>[fragmento " +
               esc(n) + " no resuelto: " + esc(motivo) + "]</div>";
      });
    out = out.replace(rx(O + "=([\\s\\S]*?)" + C),
      function (m, e) {
        var t = /(?:targetData|recipient)\.(\w+)/.exec(e) || /(\b[a-zA-Z_]\w*\b)/.exec(e);
        var key = t ? t[1] : null;
        if (key && valorMuestra(key) === null) anota(sinValor, key);
        var x = (conMuestra && key) ? valorMuestra(key) : null;
        return token(key, x !== null ? x : falta("[" + (key || "...") + "]"));
      });
    out = out.replace(rx(O + "[\\s\\S]*?" + C), "");
    return { html: out, elegidas: elegidas, noEval: noEval, noEvalTextos: noEvalTextos,
             includes: includes, sinValor: sinValor, fechas: fechas };
  }

  // Variables usadas en las condiciones y los valores con que se comparan
  function detectar(src) {
    var conds = [], m;
    var r = rx(O + "\\s*\\}?\\s*(?:else\\s+)?if\\s*\\(([\\s\\S]*?)\\)\\s*\\{\\s*" + C +
               "\\s*" + O + "\\/\\*\\s*\\[acr-dc-start-cond");
    while ((m = r.exec(src))) conds.push(m[1]);
    var vars = {}, orden = [], omitidas = [], k, mm;
    for (k = 0; k < conds.length; k++) {
      var rv = /(?:targetData|recipient)\.(\w+)/g;
      while ((mm = rv.exec(conds[k]))) {
        if (esContactoMuestra(mm[1])) {
          if (omitidas.indexOf(mm[1]) < 0) omitidas.push(mm[1]);
          continue;
        }
        if (!vars[mm[1]]) { vars[mm[1]] = { lits: [] }; orden.push(mm[1]); }
      }
      var rl = /(?:targetData|recipient)\.(\w+)\s*(?:===?|!==?)\s*(?:'([^']*)'|"([^"]*)")/g;
      while ((mm = rl.exec(conds[k]))) {
        if (esContactoMuestra(mm[1])) continue;
        var lit = mm[2] !== undefined ? mm[2] : mm[3];
        if (vars[mm[1]].lits.indexOf(lit) < 0) vars[mm[1]].lits.push(lit);
      }
    }
    // tipo: "valores" si se compara con textos no vacios; "presencia" si solo con ''
    for (k = 0; k < orden.length; k++) {
      var lits = vars[orden[k]].lits, reales = [];
      for (var j = 0; j < lits.length; j++) if (lits[j] !== "") reales.push(lits[j]);
      vars[orden[k]].reales = reales;
      vars[orden[k]].tipo = reales.length ? "valores" : "presencia";
    }
    return { orden: orden, vars: vars, n: conds.length, omitidas: omitidas };
  }

  // Agrupa banderas de presencia que se parecen (prefijo largo, o prefijo + sufijo comunes),
  // p.ej. DESCORREOEENNPRINCIPAL / DESNBREENNPRINCIPAL / DESCELULAREENNPRINCIPAL.
  // Devuelve [{ prefijo, sufijo, etiqueta, nombres:[] }]; las sueltas van en grupos de uno.
  function comunIni(a, b) {
    var n = Math.min(a.length, b.length), i = 0;
    while (i < n && a.charAt(i) === b.charAt(i)) i++;
    return a.slice(0, i);
  }
  function comunFin(a, b) {
    var n = Math.min(a.length, b.length), i = 0;
    while (i < n && a.charAt(a.length - 1 - i) === b.charAt(b.length - 1 - i)) i++;
    return i ? a.slice(a.length - i) : "";
  }
  function parecidos(a, b) {
    var p = comunIni(a, b).length, sf = comunFin(a, b).length;
    return p >= 4 || (p >= 3 && sf >= 6);
  }
  // URL a la que navega el buscador al elegir un template.
  function urlTemplate(id) { return "?frgId=" + encodeURIComponent(id); }

  function agrupar(nombres) {
    var usados = {}, salida = [], i, j;
    for (i = 0; i < nombres.length; i++) {
      if (usados[nombres[i]]) continue;
      usados[nombres[i]] = 1;
      var grupo = [nombres[i]];
      for (j = i + 1; j < nombres.length; j++) {
        if (usados[nombres[j]]) continue;
        if (parecidos(nombres[i], nombres[j])) { usados[nombres[j]] = 1; grupo.push(nombres[j]); }
      }
      var pre = grupo[0], suf = grupo[0];
      for (j = 1; j < grupo.length; j++) { pre = comunIni(pre, grupo[j]); suf = comunFin(suf, grupo[j]); }
      if (grupo.length < 2) { pre = ""; suf = ""; }
      salida.push({
        prefijo: pre,
        sufijo: suf,
        nombres: grupo,
        etiqueta: grupo.length < 2 ? grupo[0]
          : (pre + "\u2026" + (suf.length >= 4 ? suf : ""))
      });
    }
    return salida;
  }
  // END-PODA
  DICCIONARIO_UI.FLGCASHBACK = "CASHBACK";

  var $ = function (id) { return document.getElementById(id); };
  // En la prueba local con un template real, FUENTE_EXTERNA trae su HTML; el repo solo lleva el correo ficticio.
  var original = window.FUENTE_EXTERNA || $("fuente").textContent;
  if (window.FUENTE_NOMBRE) { $("buscar").value = window.FUENTE_NOMBRE; $("comboId").textContent = window.FUENTE_ID || ""; }
  var det = detectar(original);
  var vista = { w: 700, z: 100, muestra: true };
  var atajos = true, activa = 0, ultimo = null, ultimoN = -1;

  // ---------- modelo ----------
  function valoresDe(v) {
    var d = det.vars[v];
    if (d.tipo !== "valores") return ["S", ""];
    // Solo los valores que el template nombra; no se ofrece "otro valor" (la rama else).
    return d.reales.slice();
  }
  function etiqVal(v, val) {
    if (val === VAL_OTRO) return "otro valor";
    if (det.vars[v].tipo === "presencia") return val ? "con valor" : "vac\u00EDo";
    return traducirUI(val);
  }
  function etiqVar(v) { return traducirUI(v).toLowerCase(); }
  function porDefecto() { for (var i = 0; i < det.orden.length; i++) perfil[det.orden[i]] = valoresDe(det.orden[i])[0]; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function totalEscenarios() { var n = 1; for (var i = 0; i < det.orden.length; i++) n *= valoresDe(det.orden[i]).length; return n; }
  function indiceEscenario() {
    var idx = 0;
    for (var i = 0; i < det.orden.length; i++) {
      var vals = valoresDe(det.orden[i]);
      idx = idx * vals.length + Math.max(0, vals.indexOf(perfil[det.orden[i]]));
    }
    return idx + 1;
  }

  // ---------- estado en la URL: cada escenario tiene su enlace ----------
  function leerURL() {
    var q = location.search.replace(/^\?/, "").split("&");
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split("="), k = decodeURIComponent(kv[0] || ""), v = decodeURIComponent(kv[1] || "");
      if (k.indexOf("v.") === 0 && det.vars[k.slice(2)] && valoresDe(k.slice(2)).indexOf(v) >= 0) perfil[k.slice(2)] = v;
      else if (k === "w" && v === "375") vista.w = 375;

  function escribirURL() {

  // ---------- ficha ----------

  var ETIQ = { FECINICIOVIGENCIACAMPANIA: "Inicio de vigencia", FECFINVIGENCIACAMPANIA: "Fin de vigencia" };

  // ---------- matasellos y notas ----------
  function pintarSello(r) {

      items.push({ t: "Grupo " + r.elegidas[i].grupo + ": ninguna rama cumple con este escenario", sel: '[data-pv-sinrama="' + r.elegidas[i].grupo + '"]' });
    for (i = 0; i < r.noEvalTextos.length; i++) items.push({ t: "Condici\u00F3n que no se puede evaluar", code: r.noEvalTextos[i] });
    for (i = 0; i < r.includes.length; i++) items.push({ t: "Fragmento no resuelto", code: r.includes[i] });
    if (vista.muestra) for (i = 0; i < r.sinValor.length; i++)

    $("selloInf").textContent = n ? "REVISAR" : "LISTO";
    num.style.display = n ? "" : "none";
    $("selloOk").style.display = n ? "none" : "";
    if (n !== ultimoN) {

    var ol = $("notas");
    ol.textContent = "";
    for (i = 0; i < items.length; i++) {
      (function (it) {
        var li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.className = "nota";
        b.innerHTML = '<svg class="ico"><use href="#i-x"/></svg><span></span>';
        var sp = b.querySelector("span");
        sp.appendChild(document.createTextNode(it.t));
        if (it.code) { sp.appendChild(document.createTextNode(" ")); var c = document.createElement("code"); c.textContent = it.code; sp.appendChild(c); }
        if (it.sel) { b.onclick = function () { irA(it.sel); }; b.title = "Ir a la marca en el correo"; } else b.disabled = true;

  }
  function irA(sel) {

    var z = vista.z / 100, top = el.getBoundingClientRect().top * z + $("hoja").offsetTop - 80;
    $("mesa").scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    el.removeAttribute("data-pv-flash"); void el.offsetWidth; el.setAttribute("data-pv-flash", "");
  }

  // ---------- correo ----------
  function marcar(d) {
    var st = d.createElement("style");
    st.textContent = "[data-pv-falta]{background:#fce9e6;color:#8c1d15;box-shadow:inset 0 -2px #c62d1f;border-radius:2px}" +
      "[data-pv-k]:not([data-pv-falta]){outline:2px dashed #c62d1f;outline-offset:3px}" +
      ".pv-nota{display:block;margin:6px 0 14px;padding:7px 10px;font:600 12px/1.35 -apple-system,Segoe UI,sans-serif;color:#8c1d15;background:#fce9e6;border:1px dashed #c62d1f;border-radius:4px}" +
      "[data-pv-flash]{animation:pvf 1.2s cubic-bezier(0.23,1,0.32,1)}" +
      "@keyframes pvf{0%,40%{box-shadow:0 0 0 6px rgba(198,45,31,.45)}100%{box-shadow:0 0 0 0 rgba(198,45,31,0)}}" +
      "@media (prefers-reduced-motion:reduce){[data-pv-flash]{animation:none;box-shadow:0 0 0 4px rgba(198,45,31,.45)}}";

    for (i = 0; i < textos.length; i++) {
      n = textos[i];

  }
  function medir() {

    mesa.scrollTop = sc;
  }

  function pintar() {
    var r = podar(original, perfil, { muestra: vista.muestra, senalar: true });
    ultimo = podar(original, perfil, { muestra: vista.muestra });
    var ifr = $("vista");
    ifr.onload = function () { marcar(ifr.contentDocument); medir(); };
    ifr.srcdoc = r.html;

    pintarFechas(r.fechas);

  // ---------- acciones ----------

  }
  $("bHtml").onclick = function () {

  };

    var b = this;
    try { navigator.clipboard.writeText(location.href).then(function () { avisoBoton(b, "Enlace copiado"); }, function () { avisoBoton(b, "Copia manual"); }); }
    catch (e) { avisoBoton(b, "Copia manual"); }
  };
  $("bWf").onclick = function () { anunciar("El env\u00EDo a Workfront est\u00E1 pausado"); };
  $("bDef").onclick = function () { porDefecto(); pintar(); anunciar("Escenario por defecto"); };
  $("bMuestra").onclick = function () { vista.muestra = !vista.muestra; pintar(); };
  $("bFechas").onclick = function () {
    var abre = $("fechas").hidden;
    $("fechas").hidden = !abre; this.setAttribute("aria-expanded", abre ? "true" : "false");

  };
  $("sello").onclick = function () {

  $("zMenos").onclick = function () { vista.z = Math.max(50, vista.z - 10); pintar(); };
  document.onkeydown = function (ev) {

    if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {

      if (t && t.tagName === "SELECT") return;
      ev.preventDefault(); paso(ev.key === "ArrowRight" ? 1 : -1);

    }

    else if (ev.key === "/") { ev.preventDefault(); $("buscar").focus(); $("buscar").select(); }
    else if (ev.key === "d" || ev.key === "D") { vista.w = 700; pintar(); }
    else if (ev.key === "m" || ev.key === "M") { vista.w = 375; pintar(); }
  };
  window.onresize = medir;

  porDefecto();
  leerURL();
  pintar();
})();
